[package]
name = "film-finder"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }

# HTML parsing
scraper = "0.21"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Regex for parsing
regex = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Async trait support
async-trait = "0.1"

# Environment variables
dotenvy = "0.15"

# URL encoding for API calls
urlencoding = "2"
